name: Deploy Chimpions Dash

on:
  push:
    branches:
      - main
    paths:
      - 'dist/**'
      - 'engine-qa.mjs'
      - 'qa.cjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    name: Validate game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run deterministic engine QA
        run: node engine-qa.mjs

      - name: Run UI QA
        run: node qa.cjs

  deploy:
    name: Deploy GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install image recovery tool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Recover original top-row obstacle art
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('dist/assets/obstacles-atlas.webp')
          data=src.read_bytes()
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Obstacle atlas is not a RIFF WebP file')
          expected=int.from_bytes(data[4:8],'little')+8
          if len(data) < expected:
              data += b'\0' * (expected-len(data))
          Path('/tmp/obstacles-padded.webp').write_bytes(data)
          print(f'obstacle atlas: repo={src.stat().st_size} bytes, repaired={len(data)} bytes')
          PY
          ffmpeg -hide_banner -loglevel error -y -i /tmp/obstacles-padded.webp -vf "crop=1536:512:0:0" -frames:v 1 dist/assets/obstacles-atlas-recovered.png
          test -s dist/assets/obstacles-atlas-recovered.png
          rm -f /tmp/obstacles-padded.webp
          # Broken legacy files are not used by the new renderer; don't ship them.
          rm -f dist/assets/obstacles-atlas.webp dist/assets/ground-v3.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
